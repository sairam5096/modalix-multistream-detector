# YOLOv6 on Neat 0.6.0+ — 42 streams @ 3 fps with a RAW-HEAD YOLOv6 pack.
#
# Neat 0.6.0 decodes `decode_type: yolov6` as raw l/t/r/b + class logits. Packs made with
# tools/surgery (decoded cx,cy,w,h in the graph) give frame-sized boxes on 0.6.0; build the
# pack with tools/yolov6_raw_export instead and set BOTH extra fields below
# (see docs/NEAT_0.6.0_YOLOV6.md, sima-neat/core#1272). The app needs 2-4 models, so a
# YOLO26 pack rides along as the second entry; cameras default to the YOLOv6 one.
#
# Measured on a Modalix DevKit (Neat 0.6.0, SDK 3.0.0): 42 x 720p @ 3 fps, all 42 cameras at
# the source cadence, ~1.2 A65 cores, CMA flat. Replace MEDIA_HOST with your RTSP server.
models:
  - {name: coco-v6, description: "YOLOv6s bf16, raw heads (tools/yolov6_raw_export)", path: ../models/yolov6s_raw_mpk.tar.gz, decode_type: yolov6, decode_type_option: GroupedByRoleLogit, num_classes: 80, labels: coco_label.txt, min_score: 0.30}
  - {name: coco-26, description: "YOLO26n int8", path: ../models/yolo26n-det-int8-b1.tar.gz, decode_type: yolo26, labels: coco_label.txt, min_score: 0.45}
default_models: [coco-v6]
streams:
  - {url: rtsp://MEDIA_HOST:8554/cam01, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/cam02, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/cam03, models: [coco-v6]}
