# YOLOv6 multi-model, multi-stream demo — 24 streams @ 5 fps, route topology.
#
# Two models loaded and kept warm; each camera is routed to ONE of them:
#   - cameras 01-12 -> coco-v6  (YOLOv6n, decode_type: yolov6)
#   - cameras 13-24 -> coco-n   (YOLO26n, decode_type: yolo26)
# This shows YOLOv6 running inside the shared multi-model framework alongside a
# YOLO26 model, with per-camera model selection (also switchable at runtime via
# the control API).
#
# Replace MEDIA_HOST with your RTSP server (e.g. a MediaMTX instance).
#
# NOTE on stream count: YOLOv6n's MLA throughput is lower than YOLO26n's
# (~187 fps vs ~240 fps on this SoM), so an all-YOLOv6 load is demand-limited.
# Keep aggregate YOLOv6 demand under ~180 fps (e.g. <= ~30-36 streams @ 5 fps);
# beyond that the decode rate outpaces inference and decoded frames back up in
# CMA. See docs/BENCHMARKS.md ("YOLOv6 throughput ceiling"). This 24-stream demo
# (12 on YOLOv6 = 60 fps of YOLOv6 demand) sits comfortably inside that budget.
models:
  - {name: coco-v6, description: "YOLOv6n int8 (surgery pack)", path: ../models/yolov6n_surgery_mpk.tar.gz, decode_type: yolov6, labels: coco_label.txt, min_score: 0.45}
  - {name: coco-n,  description: "YOLO26n int8 (fast)",         path: ../models/yolo26n-det-int8-b1.tar.gz,   decode_type: yolo26,  labels: coco_label.txt, min_score: 0.45}
default_models: [coco-v6]
streams:
  - {url: rtsp://MEDIA_HOST:8554/stream_01, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/stream_02, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/stream_03, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/stream_04, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/stream_05, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/stream_06, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/stream_07, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/stream_08, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/stream_09, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/stream_10, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/stream_11, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/stream_12, models: [coco-v6]}
  - {url: rtsp://MEDIA_HOST:8554/stream_01, models: [coco-n]}
  - {url: rtsp://MEDIA_HOST:8554/stream_02, models: [coco-n]}
  - {url: rtsp://MEDIA_HOST:8554/stream_03, models: [coco-n]}
  - {url: rtsp://MEDIA_HOST:8554/stream_04, models: [coco-n]}
  - {url: rtsp://MEDIA_HOST:8554/stream_05, models: [coco-n]}
  - {url: rtsp://MEDIA_HOST:8554/stream_06, models: [coco-n]}
  - {url: rtsp://MEDIA_HOST:8554/stream_07, models: [coco-n]}
  - {url: rtsp://MEDIA_HOST:8554/stream_08, models: [coco-n]}
  - {url: rtsp://MEDIA_HOST:8554/stream_09, models: [coco-n]}
  - {url: rtsp://MEDIA_HOST:8554/stream_10, models: [coco-n]}
  - {url: rtsp://MEDIA_HOST:8554/stream_11, models: [coco-n]}
  - {url: rtsp://MEDIA_HOST:8554/stream_12, models: [coco-n]}
# 720p, 5 fps sources. target_fps 0 = no decimation. Lean decoder = low CMA per stream.
input: {width: 1280, height: 720, fps: 5, target_fps: 0, latency_ms: 100, decoder_buffers: 4, decoder_input_buffers: 1, decoder_tuning: low-memory}
# max_inflight_per_stream is the key memory knob: keep it 1-2 for high stream counts.
inference: {min_score: 0.45, nms_iou: 0.60, max_detections: 50, queue_depth: 2, internal_queue_depth: 1, max_inflight_per_stream: 2, max_inflight_total: 16}
runtime: {watchdog_stall_s: 45, rebuild_retries: 4, report_hz: 10}
control: {host: 0.0.0.0, port: 8600}
crops: {enabled: false}
