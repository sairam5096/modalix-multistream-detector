# 48 streams @ 5 fps, three INT8 models loaded, single model per camera (route).
# Replace MEDIA_HOST with your RTSP server (e.g. a MediaMTX instance).
models:
  - {name: coco-n,  description: "YOLO26n int8 (fast)",     path: ../models/yolo26n-det-int8-b1.tar.gz, decode_type: yolo26, labels: coco_label.txt, min_score: 0.45}
  - {name: coco-v8, description: "YOLOv8n int8 (alt)",      path: ../models/yolov8n_ultra_mpk.tar.gz,   decode_type: yolo26, labels: coco_label.txt, min_score: 0.45}
  - {name: coco-m,  description: "YOLO26m bf16 (accurate)", path: ../models/yolo26m-det-bf16-mla_tess-b1.tar.gz, decode_type: yolo26, labels: coco_label.txt, min_score: 0.45}
default_models: [coco-n]
streams:
  - {url: rtsp://MEDIA_HOST:8554/stream_01, models: [coco-n]}
  - {url: rtsp://MEDIA_HOST:8554/stream_02, models: [coco-n]}
